<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HermesEye · 项目 V2.0 评审</title>
<style>
:root{color-scheme:light;--bg:#f5f2ea;--ink:#202b25;--muted:#607267;--brand:#34785a;--soft:#e5eee7;--paper:#fff;--card:rgba(255,255,255,.87);--glass:rgba(255,255,255,.76);--line:rgba(63,99,75,.12);--shadow:0 8px 28px #173d2814;--wash:#cedfd180}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,'PingFang SC',sans-serif}body.dark{color-scheme:dark;--bg:#141a17;--ink:#eef3ef;--muted:#aab8af;--brand:#80c7a3;--soft:#263d30;--paper:#1d2521;--card:rgba(29,37,33,.94);--glass:rgba(38,50,43,.88);--line:rgba(180,205,186,.13);--shadow:0 8px 28px #00000030;--wash:#3b5c4340}main{max-width:1070px;margin:32px auto;display:grid;grid-template-columns:minmax(260px,1fr) 414px;gap:64px;padding:20px}aside{align-self:start;padding-top:32px}h1{font-size:36px;line-height:1.3;letter-spacing:-1px;margin:16px 0}h2{font-size:24px;line-height:1.35;margin:0}h3{font-size:17px;margin:0 0 6px}p{margin:8px 0}small,.muted{color:var(--muted);font-size:13px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--brand)}aside p{margin:20px 0}.controls{display:grid;gap:12px;margin-top:28px}button,input,textarea,select{font:inherit;color:inherit}button{border:0;background:transparent;min-height:48px;padding:10px 12px;border-radius:14px;text-align:left;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:3px}button:hover{background:var(--soft)}input,textarea,select{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-width:0}textarea{min-height:112px}label{display:block;margin:12px 0}label span{display:block;font-size:13px;margin-bottom:6px}input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}.phone{height:820px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:32px;background:radial-gradient(ellipse at 95% 8%,var(--wash),transparent 55%),var(--bg);display:flex;flex-direction:column;box-shadow:0 20px 70px #173d2809}header{padding:22px 18px 8px;display:flex;gap:8px;align-items:center;flex-shrink:0}header .title{flex:1;min-width:0}header button{font-size:24px;width:48px;padding:4px;text-align:center}#screen{flex:1;min-height:0;overflow-y:auto;padding:8px 18px 124px;scroll-padding-bottom:124px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.stack{display:grid;gap:10px}.card{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}button.card{text-align:left}button.card:hover{background:var(--paper)}.card .next{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}.tag{display:inline-block;color:var(--brand);font-size:12px;background:var(--soft);padding:3px 8px;border-radius:8px}.section{margin:24px 0 8px;font-size:14px;color:var(--muted)}.primary{background:var(--brand);color:var(--bg);width:100%;text-align:center;font-weight:600;margin:12px 0}.primary:hover{background:var(--brand);filter:brightness(.96)}.entry{width:100%;border-bottom:1px solid var(--line);border-radius:0;display:flex;justify-content:space-between;gap:12px;padding:15px 2px}.filter{display:flex;gap:10px}.filter input{flex:1;width:0}.filter select{width:112px}.check{display:flex;align-items:center;gap:8px}.check label{padding:8px;margin:0}.check button{flex:1;min-width:0;padding:8px;text-align:left}.check button b{display:block}.tabs{display:flex;gap:5px;margin:14px 0}.tabs button{flex:1;text-align:center;font-size:14px}.tabs [aria-pressed=true]{background:var(--soft);color:var(--brand)}#nav{position:absolute;z-index:2;bottom:18px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:374px;display:grid;grid-template-columns:repeat(4,1fr);padding:7px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--shadow)}#nav button{border-radius:999px;min-height:54px;text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}#nav button span{font-size:18px;line-height:20px}#nav [aria-current=page]{background:var(--soft);color:var(--brand)}dialog{background:var(--glass);color:var(--ink);border:1px solid var(--line);border-radius:28px;width:min(390px,calc(100% - 32px));max-height:85vh;padding:22px;box-shadow:var(--shadow);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}dialog::backdrop{background:#15271e55;backdrop-filter:blur(3px)}dialog h2{font-size:21px}dialog header{padding:0;margin-bottom:12px}dialog .card{background:var(--paper);backdrop-filter:none}.help{font-size:12px;color:var(--muted)}#notice{position:absolute;z-index:4;bottom:100px;left:20px;right:20px;background:var(--paper);border:1px solid var(--line);padding:12px;border-radius:14px;font-size:13px}#notice:empty{display:none}.solid{--card:var(--paper);--glass:var(--paper)}.solid .card,.solid #nav,.solid dialog{backdrop-filter:none;-webkit-backdrop-filter:none}a{color:var(--brand)}@supports not (backdrop-filter:blur(1px)){.card,#nav,dialog{background:var(--paper)}}@media(prefers-reduced-transparency:reduce){.card,#nav,dialog{background:var(--paper);backdrop-filter:none}}@media(max-width:760px){main{grid-template-columns:minmax(0,1fr);max-width:470px;gap:20px;margin:0;padding:12px}aside{padding:0}h1{font-size:28px}.phone{width:100%}.controls{grid-template-columns:1fr 1fr}.controls>label:first-child{grid-column:1/-1}}
.chat-user{max-width:82%;margin-left:auto;border-radius:20px 20px 6px 20px;background:var(--soft)}.chat-hermes{max-width:88%;margin-right:auto;border-radius:20px 20px 20px 6px;background:var(--paper)}</style>
<main><aside><div class="eyebrow">HERMES EYE / V2.0</div><h1>目标清晰。<br>下一步，就在眼前。</h1><p class="muted">项目模块卡片化 · 毛玻璃方案评审<br>依据 17-project-spec · 示例数据</p><p>首页只看进展，详情聚焦目标与下一步。阶段成果、每日行动与目标达成分别记录。</p><p class="help">按钮收纳为候选方案：统一新增菜单；生命周期操作进入更多。此原型不连接服务，不保存真实数据，刷新恢复。</p><div class="controls"><label><span>页面巡览</span><select id="preview"><option value="list">项目列表</option><option value="home">今日 · 项目摘要</option><option value="detail">项目详情</option><option value="new">新建项目</option><option value="software">软件项目</option><option value="archived">已归档项目</option></select></label><label><input id="dark" type="checkbox"> 深色预览</label><label><input id="solid" type="checkbox"> 实色对比</label></div><p><a href="../../modules/17-project-spec.md">项目规格</a> · <a href="index.html">V2.0 全页面基线</a></p></aside><section class="phone" aria-label="项目设计预览"><header id="head"></header><div id="screen"></div><nav id="nav" aria-label="主导航"></nav><div id="notice" role="status"></div></section></main><dialog id="modal"></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='list',section='overview',status='active',kind='learning',done=false,taskDone=false,filter='active',query='',chatTitle='UART 时钟与波特率',chatOwner='项目需求';const labels={active:'进行中',paused:'已暂停',completed:'已达成',archived:'已归档'};
const act=(text,key,cls='')=>`<button class="${cls}" data-a="${key}">${text}</button>`;
const tile=(title,sub,key,tail='')=>`<button class="card" data-a="${key}"><h3>${title}</h3><p class="muted">${sub}</p>${tail}</button>`;
const title=()=>kind==='software'?'个人知识工具':'理解并实现嵌入式驱动';
function notice(t){$('#notice').textContent=t;setTimeout(()=>$('#notice').textContent='',3200)}
function projectCard(){return tile(title(),kind==='software'?'用手机提出需求，逐步评审软件方案':'从看懂代码，到独立完成驱动实践','detail',`<div class="next"><small>下一步</small><p>${kind==='software'?'明确首版使用场景':'梳理 UART 初始化的三个问题'}</p></div><div class="meta"><span>${labels[status]}</span><span>阶段 ${done?2:1}/2</span><span>本机任务 ${taskDone?2:1}/3</span></div>`)}
function render(){const detail=page==='detail',input=['new','edit','chat'].includes(page);$('#head').innerHTML=`${page==='list'||page==='home'?'':act('‹','list')}<div class="title"><small>${detail?(kind==='software'?'软件构建':'学习成长')+' · '+labels[status]:'HermesEye'}</small><h2>${page==='list'?'项目':page==='home'?'今日':page==='new'?'新建项目':page==='edit'?'编辑项目':page==='chat'?'需求会话':title()}</h2></div>${page==='list'?act('＋','new'):detail?(status==='archived'?'':act('＋','add'))+act('⋯','more'):''}`;
$('#nav').hidden=input;$('#nav').innerHTML=[['◌','今日','home'],['▱','项目','list'],['▥','阅读','reading'],['⊙','我的','mine']].map(([i,t,a])=>`<button data-a="${a}" aria-current="${(page==='home'?a==='home':a==='list')?'page':'false'}"><span aria-hidden="true">${i}</span>${t}</button>`).join('');
if(page==='list'){$('#screen').innerHTML=`<div class="filter"><input id="search" aria-label="搜索项目名称或目标" placeholder="搜索项目或目标" value="${esc(query)}"><select id="filter" aria-label="项目状态">${Object.entries({...labels,all:'全部'}).map(([k,v])=>`<option value="${k}" ${filter===k?'selected':''}>${v}</option>`).join('')}</select></div><div id="results"></div>${tile('独立需求','还没形成项目的想法，也有自己的会话','independent')}`;results()}
if(page==='home')$('#screen').innerHTML=`<div class="row section"><b>今日计划</b><span>1 / 3 完成</span></div><div class="card check"><label><input type="checkbox" id="task" ${taskDone?'checked':''} aria-label="完成整理初始化步骤"></label>${act('<b>整理初始化步骤</b><small>嵌入式驱动 · '+(taskDone?'已完成':'待完成')+'</small>','task')}</div><div class="section">项目进展</div>${tile(title(),'下一步 · 梳理 UART 初始化的三个问题','detail','<div class="meta">阶段 1/2 · 本机任务 1/3</div>')}<div class="section">最近在读</div>${tile('精力管理','阅读 42% · 示例数据','reading')}`;
if(detail){$('#screen').innerHTML=`<small>本机已保存 · 尚未同步</small><div class="tabs">${[['overview','概览'],['milestones','阶段'],['actions','行动'],['reviews','复盘']].map(([k,t])=>`<button data-a="tab:${k}" aria-pressed="${section===k}">${t}</button>`).join('')}</div>${status==='archived'?'<p class="help">项目已归档，字段、阶段和复盘只读；关联事项与会话仍可继续处理。</p>':''}${section==='overview'?`${tile('目标与完成标准','从看懂代码，到独立完成驱动实践','criteria')}<div class="card"><small>下一步</small><h3>梳理 UART 初始化的三个问题</h3><div class="meta">目标日期 · 11 月 15 日</div></div>${status==='archived'?act('恢复项目','restore','primary'):act('与 Hermes 推进','hermes','primary')}<div class="section">需求会话</div>${tile('UART 时钟与波特率','最近讨论 · 10 月 10 日','oldchat')}<div class="section">阶段与复盘</div>${tile('阶段成果 · '+(done?2:1)+'/2','GPIO 已完成，UART 实践待推进','tab:milestones')}${tile('最近复盘','理解时钟与波特率的关系是下一步重点','reviewDetail')}`:section==='milestones'?`<div class="card check"><label><input type="checkbox" id="milestone" ${done?'checked':''} ${status==='archived'?'disabled':''} aria-label="完成 UART 收发实验"></label>${act('<b>独立完成 UART 收发实验</b><small>10 月 25 日 · '+(done?'已完成':'待完成')+'</small>','milestone')}</div><div class="card"><h3>GPIO 输入输出与引脚复用</h3><small>已完成 · 示例</small></div><p class="help">阶段完成不自动改变项目状态或生成每日事项。</p>`:section==='actions'?`<div class="card check"><label><input type="checkbox" id="task" ${taskDone?'checked':''} aria-label="完成整理初始化步骤"></label>${act('<b>整理初始化步骤</b><small>'+ (taskDone?'已完成':'待完成')+' · 今日</small>','task')}</div><p class="help">仅统计本机关联事务，日历会议不计入。</p>`:`${tile('GPIO 实践回顾','10 月 10 日 · 已完成实验，下一阶段理解时钟关系。','reviewDetail')}<p class="help">复盘追加后保留历史；不提供改写和删除。</p>`}${kind==='software'?tile('远程构建 · 尚未接入','当前可讨论需求；执行、成果与部署为未来能力','remote'):''}`}
if(page==='new'||page==='edit')$('#screen').innerHTML=`<form id="projectForm"><label><span>项目名称 *</span><input name="name" required maxlength="100" value="${page==='edit'?title():''}"></label><label><span>类型</span><select name="kind"><option>学习成长</option><option>健身运动</option><option>效能提升</option><option>软件构建</option><option>其他</option></select></label><label><span>想达成什么 *</span><textarea name="goal" required maxlength="4000"></textarea></label><label><span>怎样算完成 *</span><textarea name="criteria" required maxlength="4000"></textarea></label><details><summary>补充安排 · 选填</summary><label><span>目标日期</span><input type="date"></label><label><span>下一步</span><textarea maxlength="4000"></textarea></label><label><span>托管偏好（不授予执行权限）</span><select><option>手工托管</option><option>Agent 托管</option></select></label></details><button class="primary" type="submit">保存项目（演示）</button><p class="help">原型表单仅展示，不写入项目或本地存储。</p></form>`;
if(page==='chat')$('#screen').innerHTML=`<small>${chatOwner} · ${chatTitle}</small><div class="card chat-user">${chatOwner==='独立需求'?'先聊聊最近的一些想法。':'我想理解波特率分频配置。'}</div><div class="card chat-hermes">Hermes 的建议将在这里呈现。此处是示例，不连接真实服务。</div><label><span>继续这个需求</span><textarea placeholder="输入消息…"></textarea></label>${act('发送（演示）','send','primary')}`;
}
function results(){const visible=(filter==='all'||filter===status)&&(!query|| (title()+'从看懂代码到独立完成驱动实践').includes(query));$('#results').innerHTML=visible?projectCard():'<div class="card"><h3>没有匹配项目</h3><p class="muted">调整搜索或状态筛选；原有数据未被删除。</p></div>'}
function sheet(name,content){$('#modal').innerHTML=`<header><h2 class="title">${name}</h2>${act('×','close')}</header>${content}`;if(!$('#modal').open)$('#modal').showModal()}
function dispatch(a){if(a==='close'){$('#modal').close();return}if(a.startsWith('tab:')){section=a.split(':')[1];render();return}if(['list','home','detail','new','edit'].includes(a)){$('#modal').close();page=a;section='overview';render();$('#screen').scrollTop=0;return}if(a==='add')sheet('新增到项目',act('每日事项 →','addTask','entry')+act('阶段成果 →','addMilestone','entry')+act('复盘记录 →','addReview','entry'));else if(a==='more')sheet('项目管理',status==='archived'?act('恢复为进行中','restore','entry'):act('编辑项目','edit','entry')+(status==='active'?act('暂停项目','pause','entry')+act('标记目标达成','complete','entry'):act('重新推进','restore','entry'))+act('归档项目','archive','entry'));else if(a==='hermes')sheet('与 Hermes 推进',tile('继续已有需求','UART 时钟与波特率','oldchat')+tile('发起新需求','预览并编辑项目摘要，再建立会话','brief'));else if(a==='freechat'){chatTitle='漫无目的';chatOwner='独立需求';$('#modal').close();page='chat';render()}else if(a==='oldchat'){chatTitle='UART 时钟与波特率';chatOwner='项目需求';$('#modal').close();page='chat';render()}else if(a==='brief')sheet('新需求草稿',`<label><span>需求名称</span><input value="拆解 UART 实践下一步"></label><label><span>项目摘要 · 可编辑</span><textarea>项目：${title()}\n目标：独立完成驱动实践\n标准：完成 GPIO/UART 实验并解释机制\n阶段：1/2；下一步：梳理初始化问题</textarea></label><p class="help">仅当前项目摘要，不含其他项目、健康数据、日历或复盘。建立会话后仍需手动发送。</p>${act('建立需求会话（演示）','oldchat','primary')}`);else if(a==='criteria')sheet('目标与完成标准','<h3>目标</h3><p>从看懂代码到独立完成驱动实践。</p><h3>完成标准</h3><p>完成 GPIO 与 UART 实验，并能解释寄存器配置及中断处理。</p><small>目标日期：11月15日 · 手工托管</small>');else if(a==='task'||a==='milestone')sheet(a==='task'?'事项详情':'阶段详情',`<h3>${a==='task'?'整理初始化步骤':'独立完成 UART 收发实验'}</h3><p>完整说明、日期及来源在此呈现。</p>${a==='task'?act('继续关联会话','oldchat','primary'):'<small>阶段名称、日期修改与删除不在当前规格范围。</small>'}`);else if(a==='reviewDetail')sheet('复盘 · 10月10日','<p>完成 GPIO 实验。下一阶段重点理解时钟与 UART 波特率的关系。</p><small>历史记录只读，保留实际保存时间。</small>');else if(['addTask','addMilestone','addReview'].includes(a))sheet({addTask:'新增每日事项',addMilestone:'新增阶段成果',addReview:'记录复盘'}[a],`<label><span>${a==='addReview'?'实际结果、阻碍与下一步':'标题'}</span><textarea></textarea></label>${a==='addReview'?'':'<label><span>日期</span><input type="date"></label>'}<p class="help">${a==='addTask'?'当前项目预选归属；复用每日计划字段与校验。':'保存失败保留草稿。'}</p>${act('保存（演示）','save','primary')}`);else if(a==='complete')sheet('确认目标达成','<p>完成标准：完成 GPIO/UART 实验并能解释关键机制。</p><label><span>达成依据 *</span><textarea id="evidence" maxlength="3900"></textarea></label>'+act('确认达成（演示）','confirmComplete','primary'));else if(a==='confirmComplete'){if(!$('#evidence').value.trim()){notice('请填写达成依据');return}status='completed';$('#modal').close();render();notice('演示：已达成；正式实现将追加依据复盘')}else if(a==='archive')sheet('归档项目','<p>归档后项目字段、阶段和复盘只读。关联任务、提醒、会话与远端运行不会自动停止。</p>'+act('确认归档（演示）','confirmArchive','primary'));else if(['confirmArchive','pause','restore'].includes(a)){status=a==='confirmArchive'?'archived':a==='pause'?'paused':'active';$('#modal').close();render();notice('示例状态已更新')}else if(a==='remote')sheet('远程软件构建','<p>需求 → 方案评审 → 运行 → 成果评审 → 独立部署确认</p><p>当前尚未接入。未来以真实执行事件、检查结果与部署回执呈现。</p><small>本稿不提供开始运行或部署按钮。</small>');else if(a==='independent')sheet('独立需求',tile('漫无目的','围绕这个需求继续交流','freechat'));else notice('仅演示此入口；未保存、发送或连接服务')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)dispatch(b.dataset.a)});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;results()}});document.addEventListener('change',e=>{const t=e.target;if(t.id==='filter'){filter=t.value;results()}if(t.id==='milestone'){done=t.checked;render();notice(done?'阶段已完成（演示）':'阶段已重新打开（演示）')}if(t.id==='task'){taskDone=t.checked;render();notice(taskDone?'事项已完成（演示）':'已回到待完成（演示）')}if(t.id==='dark')document.body.classList.toggle('dark',t.checked);if(t.id==='solid')document.body.classList.toggle('solid',t.checked);if(t.id==='preview'){page=['software','archived'].includes(t.value)?'detail':t.value;kind=t.value==='software'?'software':'learning';status=t.value==='archived'?'archived':'active';section='overview';render()}});document.addEventListener('submit',e=>{e.preventDefault();notice('表单校验通过（演示），未写入真实数据')});render();
</script></html>
