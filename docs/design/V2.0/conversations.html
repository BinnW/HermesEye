<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HermesEye · 极简会话 V2.0</title><style>
:root{color-scheme:light;--bg:#f5f2ea;--ink:#202b25;--muted:#607267;--brand:#34785a;--soft:#e5eee7;--paper:#fff;--card:rgba(255,255,255,.87);--glass:rgba(255,255,255,.76);--line:rgba(63,99,75,.12);--shadow:0 8px 28px #173d2814;--wash:#cedfd180}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,'PingFang SC',sans-serif}body.dark{color-scheme:dark;--bg:#141a17;--ink:#eef3ef;--muted:#aab8af;--brand:#80c7a3;--soft:#263d30;--paper:#1d2521;--card:rgba(29,37,33,.94);--glass:rgba(38,50,43,.88);--line:rgba(180,205,186,.13);--shadow:0 8px 28px #00000030;--wash:#3b5c4340}main{max-width:1070px;margin:32px auto;display:grid;grid-template-columns:minmax(260px,1fr) 414px;gap:64px;padding:20px}aside{align-self:start;padding-top:32px}h1{font-size:36px;line-height:1.3;letter-spacing:-1px;margin:16px 0}h2{font-size:24px;line-height:1.35;margin:0}h3{font-size:17px;margin:0 0 6px}p{margin:8px 0}small,.muted{color:var(--muted);font-size:13px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--brand)}aside p{margin:20px 0}.controls{display:grid;gap:12px;margin-top:28px}button,input,textarea,select{font:inherit;color:inherit}button{border:0;background:transparent;min-height:48px;padding:10px 12px;border-radius:14px;text-align:left;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:3px}button:hover{background:var(--soft)}input,textarea,select{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-width:0}textarea{min-height:112px}label{display:block;margin:12px 0}label span{display:block;font-size:13px;margin-bottom:6px}input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}.phone{height:820px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:32px;background:radial-gradient(ellipse at 95% 8%,var(--wash),transparent 55%),var(--bg);display:flex;flex-direction:column;box-shadow:0 20px 70px #173d2809}header{padding:22px 18px 8px;display:flex;gap:8px;align-items:center;flex-shrink:0}header .title{flex:1;min-width:0}header button{font-size:24px;width:48px;padding:4px;text-align:center}#screen{flex:1;min-height:0;overflow-y:auto;padding:8px 18px 124px;scroll-padding-bottom:124px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.stack{display:grid;gap:10px}.card{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}button.card{text-align:left}button.card:hover{background:var(--paper)}.card .next{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}.tag{display:inline-block;color:var(--brand);font-size:12px;background:var(--soft);padding:3px 8px;border-radius:8px}.section{margin:24px 0 8px;font-size:14px;color:var(--muted)}.primary{background:var(--brand);color:var(--bg);width:100%;text-align:center;font-weight:600;margin:12px 0}.primary:hover{background:var(--brand);filter:brightness(.96)}.entry{width:100%;border-bottom:1px solid var(--line);border-radius:0;display:flex;justify-content:space-between;gap:12px;padding:15px 2px}.filter{display:flex;gap:10px}.filter input{flex:1;width:0}.filter select{width:112px}.check{display:flex;align-items:center;gap:8px}.check label{padding:8px;margin:0}.check button{flex:1;min-width:0;padding:8px;text-align:left}.check button b{display:block}.tabs{display:flex;gap:5px;margin:14px 0}.tabs button{flex:1;text-align:center;font-size:14px}.tabs [aria-pressed=true]{background:var(--soft);color:var(--brand)}#nav{position:absolute;z-index:2;bottom:18px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:374px;display:grid;grid-template-columns:repeat(4,1fr);padding:7px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--shadow)}#nav button{border-radius:999px;min-height:54px;text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}#nav button span{font-size:18px;line-height:20px}#nav [aria-current=page]{background:var(--soft);color:var(--brand)}dialog{background:var(--glass);color:var(--ink);border:1px solid var(--line);border-radius:28px;width:min(390px,calc(100% - 32px));max-height:85vh;padding:22px;box-shadow:var(--shadow);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}dialog::backdrop{background:#15271e55;backdrop-filter:blur(3px)}dialog h2{font-size:21px}dialog header{padding:0;margin-bottom:12px}dialog .card{background:var(--paper);backdrop-filter:none}.help{font-size:12px;color:var(--muted)}#notice{position:absolute;z-index:4;bottom:100px;left:20px;right:20px;background:var(--paper);border:1px solid var(--line);padding:12px;border-radius:14px;font-size:13px}#notice:empty{display:none}.solid{--card:var(--paper);--glass:var(--paper)}.solid .card,.solid #nav,.solid dialog{backdrop-filter:none;-webkit-backdrop-filter:none}a{color:var(--brand)}@supports not (backdrop-filter:blur(1px)){.card,#nav,dialog{background:var(--paper)}}@media(prefers-reduced-transparency:reduce){.card,#nav,dialog{background:var(--paper);backdrop-filter:none}}@media(max-width:760px){main{grid-template-columns:minmax(0,1fr);max-width:470px;gap:20px;margin:0;padding:12px}aside{padding:0}h1{font-size:28px}.phone{width:100%}.controls{grid-template-columns:1fr 1fr}.controls>label:first-child{grid-column:1/-1}}

header{background:var(--glass);backdrop-filter:blur(24px);border-bottom:1px solid var(--line)}header h2{font-size:18px}header small{font-size:12px}#screen{padding:22px 16px 20px}.stamp{text-align:center;color:var(--muted);font-size:11px;margin:0 0 22px}.message{display:flex;flex-direction:column;align-items:flex-start;margin:18px 0}.message.user{align-items:flex-end}.message small{font-size:11px;margin:0 4px 6px}.bubble{padding:13px 16px;background:var(--paper);border:1px solid var(--line);border-radius:20px 20px 20px 6px;max-width:88%;overflow-wrap:anywhere;white-space:pre-wrap}.user .bubble{background:var(--soft);border-color:transparent;border-radius:20px 20px 6px 20px;max-width:82%}.message p{margin:0}.compose-wrap{padding:10px 16px 20px;background:var(--glass);backdrop-filter:blur(24px);border-top:1px solid var(--line)}.compose{display:flex;align-items:flex-end;gap:6px;border-radius:26px;background:var(--paper);border:1px solid var(--line);padding:6px}.compose textarea{border:0;background:transparent;resize:none;min-height:42px;height:48px;max-height:144px;padding:10px 4px;flex:1;font-size:16px}.compose button{min-width:44px;min-height:44px;text-align:center;border-radius:50%;padding:8px}.send{background:var(--brand);color:var(--bg)}.send:disabled{opacity:.38}.context{font-size:12px;color:var(--brand);padding:0 10px;margin-bottom:6px;min-height:32px}.msg-tools{font-size:12px;color:var(--muted);min-height:32px;padding:2px 6px;margin-top:4px}.inline-note{font-size:12px;color:var(--muted);text-align:center;padding:10px}.bubble button{width:100%;font-size:14px;padding:8px 0;color:var(--brand)}.bubble pre{overflow:auto;font:13px/1.5 monospace;white-space:pre;max-width:100%}#notice{bottom:112px}.compose-wrap button:hover{background:var(--soft);color:var(--brand)}
</style><main><aside><div class="eyebrow">HERMES EYE / CONVERSATIONS</div><h1>专注对话。<br>让界面退后一步。</h1><p class="muted">Hermes 在左，你在右。<br>会话始终属于具体需求。</p><p>正文使用实色气泡，顶栏与输入区延续轻毛玻璃。仅异常、上下文选择和执行确认需要额外控件。</p><div class="controls"><label><span>会话来源 · 示例</span><select id="source"><option>项目 · UART 时钟与波特率</option><option>每日事项 · 整理初始化步骤</option><option>阅读 · 讨论本周总结</option><option>独立需求 · 漫无目的</option><option>成果评审 · 讨论检查结果</option></select></label><label><input id="dark" type="checkbox"> 深色</label><label><input id="solid" type="checkbox"> 实色对比</label><label><span>消息状态</span><select id="state"><option value="normal">正常对话</option><option value="working">正在回复</option><option value="failed">发送失败</option><option value="offline">连接中断</option><option value="approval">待确认行动</option><option value="empty">新需求</option></select></label></div><p class="help">纯设计示例，不发送真实消息。来源选择用于评审，不属于产品会话页。</p></aside><section class="phone"><header><button id="back" aria-label="返回来源详情">‹</button><div class="title"><h2 id="title">UART 时钟与波特率</h2><small id="owner">项目需求</small></div><button id="more" aria-label="会话更多">⋯</button></header><div id="screen" aria-label="消息记录"></div><div class="compose-wrap"><button class="context" id="contextBadge" hidden>本次上下文 · 已选择 1 项 ×</button><form class="compose" id="composer"><button type="button" id="context" aria-label="选择本次上下文">＋</button><textarea id="draft" aria-label="消息" placeholder="围绕这个需求继续…"></textarea><button class="send" type="submit" id="send" aria-label="发送消息" disabled>↑</button></form></div><div id="notice" role="status"></div></section></main><dialog id="modal"></dialog><script>
const $=s=>document.querySelector(s);let messages=[],mode='normal';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){$('#notice').textContent=t;setTimeout(()=>$('#notice').textContent='',2500)}
function render(){let text=$('#source').value,parts=text.split(' · ');$('#title').textContent=parts[1];$('#owner').textContent=parts[0]+'需求';let example=parts[0]==='阅读'?['这周读完后，怎样把笔记用起来？','先选一个与你当前问题有关的观点，结合实际经历写下理解，再决定要不要尝试一个小行动。']:parts[0]==='独立需求'?['我想先聊聊最近的一些想法。','可以。最近有什么事情让你反复想到？']:['先帮我梳理 UART 初始化的关键步骤。','可以先分为三个部分：\n\n1. 时钟与引脚复用\n2. 波特率与帧格式\n3. 收发使能与验证\n\n你目前最不确定的是哪一部分？'];let base=mode==='empty'?[]:[['user',example[0]],['assistant',example[1]],['user','先从第一步展开。']];$('#screen').innerHTML='<div class="stamp">本次需求 · 示例消息</div>'+(base.concat(messages).map(([who,t])=>`<article class="message ${who}"><small>${who==='user'?'你':'Hermes'}</small><div class="bubble">${esc(t)}</div>${who==='assistant'?'<button class="msg-tools" data-message>更多</button>':''}</article>`).join(''))+(mode==='working'?'<div class="message"><small>Hermes</small><div class="bubble">正在回复…</div></div>':mode==='failed'?'<div class="message user"><small>未发送</small><button class="msg-tools" id="retry">发送失败 · 查看处理方式</button></div>':mode==='offline'?'<div class="inline-note">连接已中断 · 回复可能尚未完成</div>':mode==='approval'?'<div class="message"><small>Hermes · 行动建议</small><div class="bubble"><b>整理一份实践清单</b><p>尚未执行，需核对范围与依据。</p><button id="approval">查看并确认 →</button></div></div>':mode==='empty'?'<div class="inline-note">从这个需求开始讨论。消息由你手动发送。</div>':'');update()}
function update(){$('#send').disabled=mode!=='working'&&!$('#draft').value.trim();$('#send').textContent=mode==='working'?'■':'↑';$('#send').setAttribute('aria-label',mode==='working'?'停止生成':'发送消息')}
function modal(title,body){$('#modal').innerHTML='<header><h2 class="title">'+title+'</h2><button id="close" aria-label="关闭">×</button></header>'+body;$('#modal').showModal();$('#close').onclick=()=>$('#modal').close()}
$('#more').onclick=()=>modal('会话信息','<p>归属：'+esc($('#source').value)+'</p><p>连接状态：设计示例</p><p>历史消息与本次分享范围分别管理。</p>');$('#back').onclick=()=>toast('返回来源详情并恢复位置（演示）');$('#context').onclick=()=>{modal('本次上下文','<p class="help">默认不选择额外资料。只对本次发送生效。</p><label><input id="ctx" type="checkbox"> 当前需求相关资料快照</label><button class="primary" id="choose">确认本次选择</button>');$('#choose').onclick=()=>{$('#contextBadge').hidden=!$('#ctx').checked;$('#modal').close()}};$('#contextBadge').onclick=()=>{$('#contextBadge').hidden=true};$('#draft').oninput=update;$('#composer').onsubmit=e=>{e.preventDefault();if(mode==='working'){mode='normal';$('#state').value='normal';render();toast('已停止本地生成演示；远端运行状态需另行查询');return}if(!$('#draft').value.trim())return;if(mode==='offline'){toast('尚未连接，输入保留；不会自动重发');return}messages.push(['user',$('#draft').value.trim()]);$('#draft').value='';$('#contextBadge').hidden=true;render();$('#screen').scrollTop=$('#screen').scrollHeight;toast('仅在本页展示，未向 Hermes 发送')};$('#source').onchange=()=>{messages=[];$('#draft').value='';$('#contextBadge').hidden=true;render()};$('#state').onchange=()=>{mode=$('#state').value;render()};$('#dark').onchange=e=>document.body.classList.toggle('dark',e.target.checked);$('#solid').onchange=e=>document.body.classList.toggle('solid',e.target.checked);document.addEventListener('click',e=>{if(e.target.matches('[data-message]'))modal('消息操作','<p>复制消息、查看来源在这里按需提供；本稿不操作剪贴板。</p>');if(e.target.id==='retry')modal('发送状态','<p>确认未发送后才允许手动重试。受理状态未知时先查询原请求，禁止自动重放。</p>');if(e.target.id==='approval')modal('核对行动范围','<p>目标：当前项目实践清单。依据：本次讨论。</p><p>正式确认需展示完整范围、权限及对应方案版本。本稿不执行任何行动。</p>')});render();
</script></html>
